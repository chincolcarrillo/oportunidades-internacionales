name: Checks (offline)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: Rscript scripts/test.R
      - run: Rscript scripts/demo_agents.R
      - run: Rscript scripts/qa.R
      - run: Rscript scripts/render_site.R
      - uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site/_site/
          retention-days: 30
