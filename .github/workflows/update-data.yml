name: Update data
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        type: choice
        options: [monitor, discover, full]
        default: monitor
      limit:
        description: Maximum sources or candidates
        type: number
        default: 5
  schedule:
    - cron: '17 10 * * 2,5'
    - cron: '43 10 * * 0'
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    if: vars.ENABLE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_MAX_CALLS: '10'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Tests without API
        run: Rscript scripts/test.R
        env:
          OPENAI_API_KEY: ''
          RUN_RENDER_TEST: 'true'
      - name: Select cadence
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          mode=monitor
          limit=200
          if [ "$EVENT_SCHEDULE" = '43 10 * * 0' ]; then mode=discover; limit=5; fi
          if [ -n "$INPUT_MODE" ]; then mode="$INPUT_MODE"; limit="$INPUT_LIMIT"; fi
          Rscript scripts/update.R --mode "$mode" --limit "$limit"
      - name: Validate
        run: Rscript scripts/qa.R
      - name: Commit only data changes
        run: |
          git add data/canonical data/published
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update international research opportunities'
            git push
          fi
